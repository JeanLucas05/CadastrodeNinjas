<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konoha Command - Registro de Ninjas</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#0c0f10",
            "on-primary": "#561f00",
            tertiary: "#c2c4e9",
            "on-tertiary-fixed": "#161936",
            "secondary-fixed-dim": "#c4c5dd",
            "surface-container": "#1d2021",
            "primary-fixed": "#ffdbcc",
            "on-primary-fixed": "#351000",
            "on-background": "#e1e3e4",
            "on-secondary-container": "#b6b6cf",
            "primary-container": "#ff6b00",
            secondary: "#c4c5dd",
            "secondary-container": "#46485c",
            "on-surface-variant": "#e2bfb0",
            outline: "#a98a7d",
            "primary-fixed-dim": "#ffb693",
            "surface-container-high": "#282a2b",
            "surface-bright": "#373a3b",
            "on-primary-container": "#572000",
            "on-secondary": "#2d2f42",
            "outline-variant": "#5a4136",
            "on-surface": "#e1e3e4",
            surface: "#111415",
            primary: "#ffb693",
            "on-error": "#690005",
            "on-tertiary": "#2b2e4c",
            "surface-container-low": "#191c1d",
            "error-container": "#93000a",
            error: "#ffb4ab",
            "surface-container-highest": "#323536",
            background: "#111415",
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: { "container-max": "1440px", gutter: "24px", xs: "4px", lg: "24px", sm: "12px", md: "16px", base: "8px", xl: "40px" },
          fontFamily: { "headline-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-md": ["JetBrains Mono"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Inter"] },
        },
      },
    };
  </script>
  <style>
    body { background-color: #1A1C2E; color: #e1e3e4; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .rank-indicator { width: 4px; height: 100%; position: absolute; left: 0; top: 0; }
    .glass-card { background: rgba(45, 48, 78, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 107, 0, 0.1); }
  </style>
</head>
<body class="overflow-x-hidden">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
